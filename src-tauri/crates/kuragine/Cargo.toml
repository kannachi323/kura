[package]
name = "kuragine"
version = "0.1.0"
description = "Kura's file engine: cloud providers, working copies and local file changes"
license = "MIT"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
md-5 = "0.10"
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.13", features = ["json", "stream", "query", "form"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[features]
# An in-memory drive for testing code built on Kuragine.
test-support = []

[dev-dependencies]
tempfile = "3"
